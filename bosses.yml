# ThreeEras - chefes (bosses)
#
# Cada chefe tem uma regra anomala (comportamento implementado no plugin):
#   soberba   - pilares sustentam o dominio (invulneravel + lentidao/fraqueza)
#   avareza   - absorve itens dropados e se cura
#   ira       - cada dano recebido aumenta a forca (escalada)
#   preguica  - a regiao perde movimento (lentidao + exaustao; passivos param)
#   inveja    - cria manifestacoes falsas (copias brilhantes; a real nao brilha)
#   gula      - consome blocos do terreno ao redor
#   luxuria   - percepcao divergente + fascinacao que puxa os jogadores
#
# dominio.raio = raio de efeito, em blocos

bosses:

  soberba:
    nome: "&6O que nao se curva"
    era: medieval
    entidade: RAVAGER
    vida: 200.0
    dominio:
      raio: 20.0
      lentidao: 2
      fraqueza: 1
    pilares: 3

