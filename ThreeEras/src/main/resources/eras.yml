# ThreeEras - definicao das eras
#
# id:          identificador unico (usado nos dados dos jogadores)
# nome:        como aparece no jogo
# mundo:       nome do mundo Bukkit destino desta era (vazio = ainda nao configurado)
# ordem:       ordem de progressao narrativa (1 = primeira era)
# descricao:   texto curto para documentacao e futuros NPCs

eras:
  medieval:
    nome: "Era Medieval"
    mundo: "world"
    ordem: 1
    descricao: "Reinos, exploracao e o inicio da historia."
    requisito-missao: ""
  apocaliptica:
    nome: "Era Apocaliptica"
    mundo: ""
    ordem: 2
    descricao: "Ruinas, recursos escassos e inimigos perigosos."
    requisito-missao: "conta-que-nao-fecha"
  futurista:
    nome: "Era Futurista"
    mundo: ""
    ordem: 3
    descricao: "Tecnologia avancada e novas formas de progressao."
    requisito-missao: "faixa-no-estandarte"
