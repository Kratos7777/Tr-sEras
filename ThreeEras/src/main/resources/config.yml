# ThreeEras - configuracao principal

geral:
  # true = registros de diagnostico extras no console
  debug: false

armazenamento:
  # intervalo do salvamento automatico em segundos (0 = desligado)
  autosave-segundos: 300

jogadores:
  # era inicial de quem entra pela primeira vez no servidor
  era-inicial: "medieval"
  # abre o livro-guia automaticamente no primeiro acesso
  abrir-livro-primeiro-acesso: true
