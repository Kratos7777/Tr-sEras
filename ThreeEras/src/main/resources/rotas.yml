# ThreeEras - rotas narrativas
#
# A rota do jogador e definida por CONJUNTO de descobertas:
# quando TODAS as entradas de "requisitos" foram descobertas, a rota e
# atribuida (na ordem deste arquivo; a primeira que fechar o conjunto
# ganha). A rota e permanente. Quando todas as entradas de "fechamento"
# tambem forem descobertas, a rota e concluida (o final deste caminho).
#
# A ordem importa: rotas com conjuntos que se sobrepõem sao resolvidas
# pela posicao no arquivo.

rotas:

  raizes:
    nome: "A Rota das Raizes"
    era: medieval
    descricao: "Quem confia nos marcos, na cronica e nos corpos sem insignia descobre que o reino mentiu sobre a conta."
    requisitos:
      - fundacao-raizes
      - marcos-contagem
      - corpos-sem-insignia
    fechamento:
      - homunculos-orfaos
      - pergunta-sem-resposta

  cinzas:
    nome: "A Rota das Cinzas"
    era: apocaliptica
    descricao: "Quem viveu as zonas de quietude e os brasoes reinterpretados descobre que o mundo esqueceu de continuar."
    requisitos:
      - faccoes-sobreviventes
      - brasoes-reinterpretados
      - zonas-de-quietude
    fechamento:
      - homunculos-orfaos
      - faixa-vermelha-estandarte

  sinal:
    nome: "A Rota do Sinal"
    era: futurista
    descricao: "Quem catalogou o que a ciencia nao explica encontra um registro que nenhum periodo reconhece."
    requisitos:
      - catalogo-erebus-amostra-7-4
      - zona-de-exclusao
      - fenomeno-orfao
    fechamento:
      - registro-sem-origem
      - biblioteca-remontada
