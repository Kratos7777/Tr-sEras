# ThreeEras - dungeons (expedicoes)
#
# Cada dungeon e gerada por codigo (salas + corredores + baus + sala de chefe).
# rota: rota exigida para entrar (vazio = livre)
# chefe: id do chefe a ser derrotado na sala final
# recompensas-lore: descobertas concedidas ao concluir (rede causal)
# recompensas-itens: itens concedidos/formados nos baus (id ou id:qtd)

dungeons:

  cripta-do-rei:
    nome: "Cripta do Rei"
    era: medieval
    rota: ""
    chefe: soberba
    recompensas-lore:
      - guerra-cronologia
      - rei-da-coroa
    recompensas-itens:
      - "estandarte-faixa-vermelha"
    largura-salas: 9
    numero-salas: 4

  labirinto-das-cinzas:
    nome: "Labirinto das Cinzas"
    era: apocaliptica
    rota: cinzas
    chefe: gula
    recompensas-lore:
