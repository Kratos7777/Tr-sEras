# ThreeEras - entradas de lore
#
# status (congela a origem da informacao):
#   canon      = estabelecido pelo criador do Requiemverse
#   diretriz   = decisao confirmada pelo criador para o ThreeEras
#   proposta   = ideia em avaliacao; NAO e verdade do mundo
#   aberto     = questao sem resposta definida
#
# camada: 1 historia | 2 inconsistencias | 3 causalidade | 4 cosmologia | 5 ANORMAL
# tipo:    registro | ruina | testemunho | inconsistencia | indefinido
# contradiz: id de outra entrada que esta entrada contradiz (camada 2)

entradas:

  # ---------- ERA MEDIEVAL (camada 1: historia) ----------
  fundacao-raizes:
    era: medieval
    camada: 1
    tipo: registro
    status: diretriz
    titulo: "A Fundacao do Reino das Raizes"
    texto: "Antes que houvesse nome para o que vinha das fronteiras, o reino ja fincava fundacoes. Cada fortaleza construia suas raizes fundo no solo, e o povo dizia: o que se sustenta por baixo nao cai por cima. Ninguem sabia que estavam construindo sobre algo que apenas esperava."

  cronica-sete-pragas:
    era: medieval
    camada: 1
    tipo: registro
    status: proposta
    titulo: "Cronica Oficial - As Sete Pragas"
    texto: "Registro da corte: sete criaturas surgiram, foram identificadas, nomeadas e contidas pelo Reino das Raizes. A guerra terminou com a ordem restaurada. Assim esta escrito, e assim deve ser lido."

  homunculos-soldados:
    era: medieval
    camada: 1
    tipo: registro
    status: proposta
    titulo: "Classificacao oficial - os soldados das pragas"
    texto: "Decreto da corte: as criaturas menores que acompanham as Sete sao suas tropas. Tem hierarquia, tem posto, tem comando. Quem encontrar deve tratar como exercito inimigo e negociar conforme a guerra permite."

  # ---------- ERA MEDIEVAL (camada 2: inconsistencias) ----------
  marcos-contagem:
    era: medieval
    camada: 2
    tipo: inconsistencia
    status: proposta
    contradiz: cronica-sete-pragas
    titulo: "Os Marcos de Contagem"
    texto: "Ao longo das estradas do reino, marcos de pedra registram quantas criaturas havia em cada epoca. O primeiro marco diz tres. O segundo diz cinco. O terceiro diz sete. O quarto diz: mais do que sete. Nenhum cronista menciona o quarto marco."

  corpos-sem-insignia:
    era: medieval
    camada: 2
    tipo: inconsistencia
    status: proposta
    contradiz: homunculos-soldados
    titulo: "Os corpos sem insignia"
    texto: "Relato de campo da Capita da fronteira: os cadaveres das criaturas menores nao tinham posto, insignia nem divisa. Nao recuavam, nao negociavam, nao se afastavam de suas criaturas mesmo quando elas paravam de se mover. Se eram soldados, ninguem os havia recrutado."

  # ---------- ERA APOCALIPTICA (camada 1) ----------
  faccoes-sobreviventes:
    era: apocaliptica
    camada: 1
    tipo: registro
    status: diretriz
    titulo: "Os que sobraram"
    texto: "Quando o reino caiu, nao sobrou um povo: sobraram pedacos. Cada comunidade guarda uma versao diferente da guerra, e todas juram que a sua e a mais antiga. Nenhuma esta completa."

  brasoes-reinterpretados:
    era: apocaliptica
    camada: 2
    tipo: ruina
    status: proposta
    titulo: "Brasões que ninguém sabe ler"
    texto: "Pelas ruinas, os brasões do Reino das Raizes ainda estao nas paredes. Uma faccao os venera como protecao. Outra os cobre com tinta. Uma terceira os usa como marca de territorio sem saber o que significam. O formato das raizes, porem, ninguem alterou."

  # ---------- ERA APOCALIPTICA (camada 2/3) ----------
  zonas-de-quietude:
    era: apocaliptica
    camada: 2
    tipo: ruina
    status: proposta
    titulo: "As zonas de quietude"
    texto: "Existem lugares onde o barulho simplesmente nao acontece. Mecanismos param, plantas param, o proprio vento evita. As estruturas de contencao medievais ficam nesses lugares, como se fossem a causa, ou como se fossem a consequencia."

  faixa-vermelha-estandarte:
    era: apocaliptica
    camada: 2
    tipo: testemunho
    status: proposta
    titulo: "A faixa no estandarte"
    texto: "Um sobrevivente descreve um estandarte antigo com uma faixa vermelha que nenhum brasao do reino justifica. Para todos os outros, e apenas tingimento. O sobrevivente insiste: a faixa se movia quando o vento nao movia."

  pergunta-sem-resposta:
    era: apocaliptica
    camada: 3
    tipo: registro
    status: aberto
    titulo: "A pergunta que ninguém fez direito"
    texto: "Entre os fragmentos recuperados ha uma lista de perguntas sem resposta: o que causou a queda do mundo? quanto tempo separa as eras? o que as criaturas sao, de fato? por que os homunculos obedecem? A lista nao tem autor. Ninguem, em nenhuma era, conseguiu responder a primeira pergunta sem contradizer as outras."

  homunculos-orfaos:
    era: apocaliptica
    camada: 3
    tipo: ruina
    status: proposta
    titulo: "Os que ficaram sem ninguem"
    texto: "Em certas regioes, homunculos circulam sem criatura visivel. Continuam violentos. Continuam esperando. Nenhum registro explica o que fazem quando nao ha ninguem para obedecer — apenas que nao deixam a regiao."

  # ---------- ERA FUTURISTA (camada 4) ----------
  catalogo-erebus-amostra-7-4:
    era: futurista
    camada: 4
    tipo: registro
    status: proposta
    titulo: "Catalogo do Projeto Erebus - Amostra 7-4"
    texto: "Amostra 7-4 (nomenclatura popular: restos). Repeticao do padrao de lealdade observado nas Amostras 1-1 a 1-7 apos quarenta dias sem contato com a origem. O comportamento persiste. A causa do comportamento persiste sem explicacao. Recomendacao: nao prosseguir com testes de separacao prolongada."

  zona-de-exclusao:
    era: futurista
    camada: 4
    tipo: registro
    status: proposta
    titulo: "Zona de exclusao 12"
    texto: "Registro tecnico: equipamentos operam normalmente ate a linha limite. Alem dela, sensores registram nada, gravadores registram silencio, cameras registram ausencia de imagem. As equipes descrevem fenomenos que os equipamentos nao detectam. Nenhuma explicacao foi publicada."

  biblioteca-remontada:
    era: futurista
    camada: 4
    tipo: registro
    status: proposta
    titulo: "A Biblioteca remontada"
    texto: "O algoritmo de remontagem juntou fragmentos medievais e apocalipticos. Erros de colagem produzem frases que ninguem escreveu. A comissao classificou os erros como ruido. Tres desses ruidos descrevem eventos que ainda nao haviam acontecido."

  fenomeno-orfao:
    era: futurista
    camada: 4
    tipo: registro
    status: proposta
    titulo: "O fenomeno que nao e de ninguem"
    texto: "Registro da Zona de Exclusao 13: fenomeno catalogado, medido e — pela primeira vez — arquivado sem classificacao de origem. Nao e atribuido a nenhuma criatura conhecida, a nenhum experimento e a nenhum periodo. A comissao deixou o campo 'origem' em branco. O branco incomoda mais que uma resposta."

  # ---------- ERA FUTURISTA (camada 5: ANORMAL) ----------
  registro-sem-origem:
    era: futurista
    camada: 5
    tipo: registro
    status: proposta
    titulo: "O registro sem origem"
    texto: "Documento recuperado sem numero de catalogo, sem autor e sem data. Uma palavra aparece repetida sete vezes: ANORMAL. A analise de dados nao consegue rastrear o documento a nenhum periodo das tres eras. A comissao nao aprovou conclusao alguma. O documento continua no arquivo."
