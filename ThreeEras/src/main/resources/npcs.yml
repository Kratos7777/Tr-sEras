# ThreeEras - NPCs de dialogo
#
# id:            identificador unico (usado em comandos)
# nome:          nome exibido sobre a entidade
# era:           era do NPC (validada contra eras.yml na carga)
# tipo:          EntityType do Bukkit (ex.: VILLAGER)
# dialogo:       linhas exibidas a cada clique (com cooldown de 2s)
# por-descoberta: falas extras que so aparecem se o jogador descobriu
#                 a entrada de lore indicada
#
# A posicao do NPC e salva em plugins/ThreeEras/npcs.yml pelo comando
# /threeeras npc criar <id> (executado em jogo, na posicao desejada).

npcs:

  cronista-anselmo:
    nome: "Cronista Anselmo"
    era: medieval
    tipo: VILLAGER
    dialogo:
      - "&7O reino escreveu o que quis. Eu escrevi o que vi."
      - "&7Sete pragas, dizem os decretos. Conte os marcos da estrada e depois volte falar comigo."
    por-descoberta:
      marcos-contagem: "&bVoce viu o quarto marco. Entao ja sabe: mentiram sobre a conta."
      pergunta-sem-resposta: "&bEssa lista de perguntas... eu a escrevi. Ninguem deveria te-la recuperado."

  sobrevivente-dora:
    nome: "Dora, a que sobrou"
    era: apocaliptica
    tipo: VILLAGER
    dialogo:
      - "&7O reino caiu. Nao houve heroi no fim, so gente com pressa."
      - "&7Cada faccao jura que a versao dela e a mais antiga. Nenhuma esta completa."
    por-descoberta:
      faccoes-sobreviventes: "&bVoce leu os registros. Sim, descendemos dos sobreviventes. Sim, ninguem sabe o que os brasoes significam."
      homunculos-orfaos: "&bOs orfaos... dizem que eles esperam. Eu digo: esperam por algo que nao vem. E nao vao embora."
      zonas-de-quietude: "&bAs zonas de quietude... la o vento nao passa. E as vezes, quando tudo para, eu ouco passos."

  pesquisadora-vega:
    nome: "Pesquisadora Vega"
    era: futurista
    tipo: VILLAGER
    dialogo:
      - "&7Nos catalogamos. Nao explicamos. Sao coisas diferentes."
      - "&7A amostra 7-4 repete o comportamento ha quarenta dias. A causa continua sem explicacao."
    por-descoberta:
      catalogo-erebus-amostra-7-4: "&bVoce leu o catalogo. Entao sabe: recomendamos nao prosseguir. E vamos prosseguir."
      fenomeno-orfao: "&bVoce leu o arquivo com o campo em branco. Ninguem preenche aquele campo. Ninguem quer."
      registro-sem-origem: "&bA palavra aparece sete vezes. Sete. Isso nao deveria me incomodar. Incomoda."
      amostra-1-1: "&bSetenta e nove anos de contencao. Nove laudos. A mesma frase. Ja nao sei se isso e ciencia ou teimosia."

  capita-fronteira:
    nome: "A Capita da Fronteira"
    era: medieval
    tipo: VILLAGER
    dialogo:
      - "&7Eu vi a primeira. Gritei, atirei, fugi. Ela nem se moveu."
      - "&7A corte quis uma historia limpa. Eu entreguei a que tinha."
    por-descoberta:
      primeira-criatura: "&bEntao voce leu meu relato. A corte chamou de imaginacao. Os marcos chamaram de verdade."
      corpos-sem-insignia: "&bOs cadaveres nao tinham posto. Soldado nenhum aceitaria isso. Criatura nenhuma precisaria."

  hereje-tomas:
    nome: "O Herege Tomas"
    era: medieval
    tipo: VILLAGER
    dialogo:
      - "&7Nao sao juizos. Sao fenomenos. Anote isso antes que matem o mensageiro."
      - "&7Escondi meus papeis em forros e paredes. Alguem vai encontra-los. Espero que esteja preparado."
    por-descoberta:
      herege-tomas: "&bMeus papeis. Entao sobreviveram. O Erebus usa meus metodos e nem sabe de quem sao."
      vigilias-eternas: "&bAs vigilias! Eu disse que conter era possivel. Nao disse que era para sempre."

  sacerdote-cinzas:
    nome: "O Sacerdote das Cinzas"
    era: apocaliptica
    tipo: VILLAGER
    dialogo:
      - "&7Reconstruir e pecado. O mundo foi reduzido porque ousamos ter historia."
      - "&7As zonas de quietude sao santuarias. Quem as profana para extrair metal nao volta o mesmo."
    por-descoberta:
      culto-dos-cinzas: "&bNosso livro. Voce leu. Entao sabe que nao somos cruéis: somos devotos."
      zonas-de-quietude: "&bVoce sentiu o silencio. La dentro, o tempo nao passa. Apenas espera por nos."
      mapa-encolhido: "&bO mapa encolhe? Claro. O mundo se retira de nos, nao nos dele."

  diretora-nyx:
    nome: "Diretora Nyx"
    era: futurista
    tipo: VILLAGER
    dialogo:
      - "&7O Erebus nao busca verdades. Busca financiamento para continuar buscando."
      - "&7A Autoridade sela. O Sindicato vende. Nos estudamos. Nenhum de nos entende."
    por-descoberta:
      projeto-erebus-origem: "&bO primeiro relato. Disse que as anomalias persistem. Foi o melhor relatorio que ja escrevemos — e o menos lido."
      herdeiros-do-herege: "&bEles copiam nossos ruidos de remontagem. Se estao certos, somos todos hereges. Se errados, somos todos copistas."
      sinal-verdade: "&bO branco no campo origem... Voce viu? Ninguem preenche. E ninguem dorme depois de ver."
      entrevista-amostra-1-7: "&bA amostra repetiu frases de sessoes diferentes. Ninguem autorizou juntar as frases. Alguem vai juntar."

  rei-da-coroa:
    nome: "O Rei da Coroa de Sete Pontas"
    era: medieval
    tipo: VILLAGER
    dialogo:
      - "&7Declarei guerra porque uma aldeia deixou de responder. Nao por gloria. Porque o silencio avancava."
      - "&7Sete pontas na coroa. A fé do povo comporta sete. Contar oito seria confessa que nao controlamos a historia."
    por-descoberta:
      rei-da-coroa: "&bLeu meu registro. Sim, as pontas foram adicionadas depois. A coroa nasceu com uma."
      cerca-das-sete: "&bA cerca. O nicho vazio. Pedi que deixassem vazio — para o dia em que entendessemos o que nao soubemos nomear."

  soldado-raso:
    nome: "O soldado que recuou"
    era: medieval
    tipo: VILLAGER
    dialogo:
      - "&7Dezesseis companheiros no campo das cinzas. Nenhum com ferimento de espada."
      - "&7Chamaram de covarde. Covarde e quem volta para contar o que vio."
    por-descoberta:
      memorias-de-soldado: "&bEscreveram minhas memorias. Nao mudaram uma palavra. Agradeco por isso."
      campo-cinzas: "&bO campo. Ainda pulsa. Se um dia voltarem la, nao fiquem parados quando o pulso acelerar."

  chefe-dos-coletores:
    nome: "O chefe dos coletores"
    era: apocaliptica
    tipo: VILLAGER
    dialogo:
      - "&7Brasao vale metal. Livro vale peso. Historia nao paga imposto."
      - "&7Mas o que nao sei ler, eu guardo. So por precaucao. Nao por respeito."
    por-descoberta:
      coletores-de-ruinas: "&bNosso registro. Guardamos o que nao entendemos. Um dia alguem vem buscar."

  cientista-herege:
    nome: "A cientista herege"
    era: futurista
    tipo: VILLAGER
    dialogo:
      - "&7O Erebus publica o que da financiamento. Eu publico o que da medo."
      - "&7A seção removida do protocolo existe em backup. Claro que existe. Alguem sempre esquece de apagar."
    por-descoberta:
      laboratorio-9: "&bO laboratorio 9. A porta selada por dentro. E ninguem dentro. Isso deveria incomodar mais gente."
      protocolo-do-silencio: "&bO protocolo. A quietude nao é contencao. E o mundo pedindo permissao. E nos interrompemos."

  mestre-de-expedicoes:
    nome: "O Mestre de Expedicoes"
    era: medieval
    tipo: VILLAGER
    dialogo:
      - "&7Eu mando gente para baixo da terra. Trabalho honesto, dizem."
      - "&7Cada dungeon guarda um pedaco da historia. Quem volta, volta diferente."
    por-descoberta:
      guerra-cronologia: "&bA cripta do rei. La embaixo esta a versao que a corte nunca escreveu."

  guardia-da-cerca:
    nome: "A Guardia da Cerca"
    era: medieval
    tipo: VILLAGER
    dialogo:
      - "&7Sete nichos. Seis criaturas. O setimo ficou vazio."
      - "&7O rei mandou deixar vazio. Ninguem soube o porquê. Todos obedeceram."
    por-descoberta:
      cerca-das-sete: "&bVoce viu a cerca. Entao sabe: havia algo para colocar no nicho. E ninguem teve coragem."

  escudeiro-do-rei:
    nome: "O escudeiro do rei"
    era: medieval
    tipo: VILLAGER
    dialogo:
      - "&7A coroa tinha sete pontas quando ele morreu. Uma quando subiu ao poder."
      - "&7Nao pergunte. Eu carreguei as duas."

  cartografa-das-cinzas:
    nome: "A cartografa das cinzas"
    era: apocaliptica
    tipo: VILLAGER
    dialogo:
      - "&7Desenho o que resta. A cada ano, desenho menos."
      - "&7O mundo nao foi conquistado. Foi sendo abandonado."
    por-descoberta:
      mapa-encolhido: "&bMeus mapas encolhendo. Cada geracao ve menos terreno seguro. E ninguem ve o inimigo."

  anacoreta-do-vale:
    nome: "O anacoreta do vale"
    era: apocaliptica
    tipo: VILLAGER
    dialogo:
      - "&7La no fundo, a cidade afundou e nada se move dentro da agua."
      - "&7Os peixes nao entram. Eu tambem nao."
    por-descoberta:
      cidade-submersa: "&bA cidade submersa. Presa nao por sorte. Parada porque algo la parou."

  arquivista-do-erebus:
    nome: "O arquivista do Erebus"
    era: futurista
    tipo: VILLAGER
    dialogo:
      - "&7Catalogo tudo. Nao explico nada. Sao coisas diferentes."
      - "&7A amostra 1-1 esta em contencao ha setenta e nove anos. Nove laudos. A mesma frase."
    por-descoberta:
      amostra-1-1: "&bSetenta e nove anos. O comportamento persiste. A causa permanece sem explicacao."

  engenheira-da-contencao:
    nome: "A engenheira da contencao"
    era: futurista
    tipo: VILLAGER
    dialogo:
      - "&7A Autoridade sela. Eu projetava os selos. Achava que estavamos ganhando tempo."
      - "&7Agora acho que estavamos ganhando silencio."

  negociante-do-sindicato:
    nome: "O negociante do sindicato"
    era: futurista
    tipo: VILLAGER
    dialogo:
      - "&7Um frasco de amostra vale mais que um predio. E mais seguro."
      - "&7Nao e ganancia. E diversificacao de patrimonio."

  voz-dos-marcos:
    nome: "A voz dos marcos"
    era: medieval
    tipo: VILLAGER
    rota: raizes
    dialogo:
      - "&bVoce seguiu os marcos. Poucos chegam aqui."
      - "&bA sétima zona de perturbacao existia. O reino a omitiu da cronica — nao por maldade, por incapacidade de catalogar."
    por-descoberta:
      raizes-relicario: "&bO espelho no nicho. O reino sabia desde o inicio. Escreveu sete porque a fe comportava o sete."

  voz-das-cinzas:
    nome: "A voz das cinzas"
    era: apocaliptica
    tipo: VILLAGER
    rota: cinzas
    dialogo:
      - "&bVoce seguiu as cinzas. O mundo nao ruiu: desacelerou."
      - "&bAs zonas de quietude sao o relogio do mundo esquecendo. E nos somos os ponteiros."
    por-descoberta:
      cinzas-estrada: "&bA estrada nao foi repintada. Foi reinterpretada. Cada geracao ve uma contagem diferente."

  voz-do-sinal:
    nome: "A voz do sinal"
    era: futurista
    tipo: VILLAGER
    rota: sinal
    dialogo:
      - "&bVoce seguiu o sinal. O campo em branco do arquivo nao e ignorancia."
      - "&bE a primeira vez que a ciencia deste mundo registrou honestamente o que nao consegue classificar."
    por-descoberta:
      sinal-protocolo: "&bA quietude nao e contencao. E o mundo pedindo permissao para continuar. Se interrompida, ele continua — mas ja nao nos inclui."

